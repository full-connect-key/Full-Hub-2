# Nginx — proxy reverso para o Next.js rodando em 127.0.0.1:3000.
#
#   sudo cp deploy/nginx-full-hub.conf /etc/nginx/sites-available/full-hub
#   sudo ln -s /etc/nginx/sites-available/full-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois rode o certbot (ver DEPLOY.md) — ele reescreve este arquivo
# adicionando o bloco 443 e o redirect de HTTP para HTTPS.

server {
    listen 80;
    listen [::]:80;

    # Troque pelo domínio real.
    server_name hub.suaagencia.com.br;

    # Uploads e limites
    client_max_body_size 10M;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome: podem ser cacheados para sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserva o host e o IP real — o Supabase Auth e os cookies de sessão
        # dependem disso para montar as URLs corretas.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
