<!--
  E-mail de recuperação de senha.

  O link precisa apontar para /auth/confirm com token_hash e type=recovery: é
  essa rota que abre a sessão antes de mandar a pessoa criar a nova senha. O
  template padrão do Supabase aponta para outro lugar e o fluxo não fecha.
-->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #10141a; line-height: 1.55;">
  <h2 style="font-size: 19px; margin: 0 0 14px;">Criar nova senha</h2>

  <p style="margin: 0 0 18px;">
    Você pediu para redefinir sua senha no Full Hub.
  </p>

  <p style="margin: 0 0 22px;">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
      style="display: inline-block; background: #1c4ed8; color: #ffffff; text-decoration: none; padding: 11px 20px; border-radius: 9px; font-weight: 600;"
    >
      Criar nova senha
    </a>
  </p>

  <p style="margin: 0; font-size: 13px; color: #667085;">
    Se não foi você que pediu, ignore este e-mail — sua senha atual continua valendo.
  </p>
</div>
